name: Build mod-generator

on:
  push:
    branches: ["main"]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            output-name: mod-generator.exe
            pyinstaller-args: --onefile src/main.py --name mod-generator
          - os: ubuntu-latest
            output-name: mod-generator-linux
            pyinstaller-args: --onefile src/main.py --name mod-generator-linux
          - os: macos-latest
            output-name: mod-generator-macos
            pyinstaller-args: --onefile src/main.py --name mod-generator-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.pyinstaller-args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output-name }}
          path: dist/${{ matrix.output-name }}

      # Only upload to release when triggered by a GitHub release publish
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.output-name }}
