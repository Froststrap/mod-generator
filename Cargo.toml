[package]
name = "mod-generator"
version = "3.0.0"
edition = "2024"

[lib]
name = "mod_generator"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mod-generator"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
ffi = []

[dependencies]
clipper2-rust = "1.2"
imagequant = "4"
walkdir = "2"
kurbo = "0.11"
log = "0.4"
rayon = "1"
regex = "1"
skrifa = "0.33.2"
read-fonts = "0.31.3"
write-fonts = "0.39.1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dependencies.clap]
version = "4.6"
features = ["derive"]
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "webp"]
