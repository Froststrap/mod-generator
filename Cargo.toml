[package]
name = "mod-generator"
version = "3.0.0"
edition = "2024"

[dependencies]
clipper2-rust = "1.2"
fontations = "0.3"
serde_json = "1"
imagequant = "4"
walkdir = "2"
kurbo = "0.11"
rayon = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.clap]
version = "4.6"
features = ["derive"]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
